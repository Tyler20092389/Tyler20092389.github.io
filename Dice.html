<html>
<head>
    <title>DICE</title>

<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="manifest" href="/site.webmanifest">

</head>

<body>
    <h1>Rolling Dice</h1>

    <style>
        body {
            background-color: rgb(204, 235, 255);
        }

        h1 {
            color: rgb(0, 117, 190);
            font-weight: bold;
        }

        .dice-roll {
            margin-bottom: 20px;
        }

        .dice-inline {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        input[type="text"] {
            background-color: rgb(118, 200, 255);
            border: 1px solid #0a6285;
            padding: 5px;
            width: 100px;
            height: 20px;
            text-align: center;
        }
    </style>

    <div class="dice-inline dice-roll">     <!--6 sided dice-->
        <div>Roll 6 Sided Dice: <input type="text" id="dice1" value="1"></div>
        <button onclick="rollDice()">Roll</button>
        <img src="../Images/dice3.png" alt="Dice image" width="80">
    </div>

    <div class="dice-inline dice-roll">     <!--8 sided dice-->
        <div>Roll 8 Sided Dice: <input type="text" id="dice2" value="1"></div>
        <button onclick="rollDice2()">Roll</button>
        <img src="../Images/dice5.jpg" alt="Dice image" width="70">
    </div>

    <div class="dice-inline dice-roll">     <!--10 sided dice-->
        <div>Roll 10 Sided Dice: <input type="text" id="dice3" value="1"></div>
        <button onclick="rollDice3()">Roll</button>
        <img src="../Images/dice8.png" alt="Dice image" width="80">
    </div>

   <div class="dice-inline dice-roll">       <!--12 sided dice-->
        <div>Roll 12 Sided Dice: <input type="text" id="dice4" value="1"></div>
        <button onclick="rollDice4()">Roll</button>
        <img src="../Images/dice9.png" alt="Dice image" width="63">
    </div>

   <div class="dice-inline dice-roll">      <!--20 sided dice-->
        <div>Roll 20 Sided Dice: <input type="text" id="dice5" value="1"></div>
        <button onclick="rollDice5()">Roll</button>
        <img src="../Images/dice10.png" alt="Dice image" width="75">
    </div>

    <script>
        function rollDice() {
            var dice1 = Math.floor(Math.random() * 6) + 1;
            document.getElementById("dice1").value = dice1;
        }

        function rollDice2() {
            var dice2 = Math.floor(Math.random() * 8) + 1;
            document.getElementById("dice2").value = dice2;
        }

        function rollDice3() {
            var dice3 = Math.floor(Math.random() * 10) + 1;
            document.getElementById("dice3").value = dice3;
        }

        function rollDice4() {
            var dice4 = Math.floor(Math.random() * 12) + 1;
            document.getElementById("dice4").value = dice4;
        }

        function rollDice5() {
            var dice5 = Math.floor(Math.random() * 20) + 1;
            document.getElementById("dice5").value = dice5;
        }
    </script>

</body>
</html>
