<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<title>Password Strength Checker</title>
	<style>
		body{font-family:Segoe UI,Roboto,Arial;margin:24px;background:#db99ff;color:#222}
		.card{max-width:720px;background:#ffffff;padding:20px;border-radius:8px;box-shadow:0 6px 18px rgba(20,30,60,.08);margin:auto}
		h1{font-size:20px;margin:0 0 12px}
		.row{display:flex;gap:12px;align-items:center}
		input[type="password"],input[type="text"]{flex:1;padding:10px;border:1px solid #b145f4;border-radius:6px;font-size:16px}
		.meter{height:12px;background:#e2d7ff;border-radius:8px;overflow:hidden;margin-top:12px}
		.meter > i{display:block;height:100%;width:0%;background:linear-gradient(90deg,#ff4d4f,#ffa94d);transition:width .25s ease,background .25s ease}
		.status{margin-top:10px;font-weight:600}
		.suggestions{margin-top:12px}
		.suggestions li{margin:6px 0}
		.muted{color:#6b7280;font-weight:400}
		.controls{display:flex;gap:8px;align-items:center;margin-left:8px}
		.score-badge{padding:6px 10px;border-radius:999px;background:#d5a9ff;color:#3730a3;font-weight:700}
		.small{font-size:13px}
	</style>
</head>
<body>
	<div class="card">
		<h1>Password Strength Checker</h1>
		<p class="muted">Type a password below to see strength, suggestions, and a visual meter.</p>

		<div class="row" style="margin-top:12px">
			<input id="pw" type="password" placeholder="Enter password" aria-label="Password input" />
			<div class="controls">
				<label class="small"><input id="show" type="checkbox" /> Show</label>
			</div>
		</div>

		<div class="meter" aria-hidden="true"><i id="bar"></i></div>
		<div class="row" style="justify-content:space-between">
			<div class="status small">Strength: <span id="label">—</span></div>
			<div class="score-badge" id="percent">0%</div>
		</div>

		<ul class="suggestions small" id="tips"></ul>

		<p class="muted small" style="margin-top:14px">Suggestions update as you type. This runs locally in your browser.</p>
	</div>

	<script>
		const pw = document.getElementById('pw');
		const bar = document.getElementById('bar');
		const label = document.getElementById('label');
		const tips = document.getElementById('tips');
		const percent = document.getElementById('percent');
		const show = document.getElementById('show');

		show.addEventListener('change', e => {
			pw.type = show.checked ? 'text' : 'password';
		});

		pw.addEventListener('input', e => update(pw.value));

		function update(input){
			const result = evaluatePassword(input);
			const pct = Math.min(100, Math.round((result.score/7)*100));
			percent.textContent = pct + '%';
			bar.style.width = pct + '%';
			bar.style.background = colorForScore(result.score);
			label.textContent = labelForScore(result.score);

			// update tips
			tips.innerHTML = '';
			if(!input){
				tips.innerHTML = '<li class="muted">Start typing to see suggestions.</li>';
				return;
			}
			if(result.suggestions.length===0){
				tips.innerHTML = '<li style="color:green">No suggestions — good job!</li>';
			} else {
				for(const s of result.suggestions){
					const li = document.createElement('li'); li.textContent = s; tips.appendChild(li);
				}
			}
		}

		function evaluatePassword(pw){
			let score = 0;
			const suggestions = [];
			if(!pw) return {score:0,suggestions:['Type a password to evaluate']};

			// length
			if(pw.length >= 8) score += 1; else suggestions.push('Use at least 8 characters');
			if(pw.length >= 12) score += 1;

			// character variety
			if(/[a-z]/.test(pw)) score += 1; else suggestions.push('Add lowercase letters');
			if(/[A-Z]/.test(pw)) score += 1; else suggestions.push('Add uppercase letters');
			if(/\d/.test(pw)) score += 1; else suggestions.push('Add numbers');
			if(/[^A-Za-z0-9]/.test(pw)) score += 1; else suggestions.push('Add symbols (e.g. !@#$%)');

			// penalize obvious sequences or common passwords
			const lower = pw.toLowerCase();
			const common = ['password','1234','12345','123456','qwerty','letmein','1111'];
			for(const c of common){ if(lower.includes(c)){ score = Math.max(1, score-2); suggestions.unshift('Avoid common patterns like "' + c + '"'); break; } }

			return {score, suggestions};
		}

		function labelForScore(s){
			if(s <= 1) return 'Very Weak';
			if(s === 2) return 'Weak';
			if(s <= 4) return 'Medium';
			if(s === 5) return 'Strong';
			return 'Very Strong';
		}

		function colorForScore(s){
			if(s <= 1) return 'linear-gradient(90deg,#ff4d4f,#ff7a45)';
			if(s === 2) return 'linear-gradient(90deg,#ff7a45,#ffd666)';
			if(s <= 4) return 'linear-gradient(90deg,#ffd666,#7bd389)';
			if(s === 5) return 'linear-gradient(90deg,#5eead4,#22c55e)';
			return 'linear-gradient(90deg,#22c55e,#16a34a)';
		}

		// initialize
		update('');
	</script>
</body>
</html>
